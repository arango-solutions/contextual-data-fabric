# CI for the fabric engine (CC-9 and the SOTA reliability evidence gate).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Full four-engine run, including Snowflake, every weekday at 06:17 UTC.
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: cdf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # snowflake-connector-python: the pool/retry unit tests exercise the real
      # connector's error classes (mock-fidelity); without it they importorskip.
      - run: |
          pip install -e ".[test,service,mcp,auth,assembly]" ruff mypy \
            snowflake-connector-python -r deploy/pins/arango-sparql-py.txt
      - name: Offline catalog integrity
        run: make catalog-integrity PY=python
      - name: Offline authorization golden
        run: make authorization-golden PY=python
      - run: ruff check src tests deploy
      - run: mypy src
      - run: pytest tests -q
      - name: Validate tracked CK25 evidence
        run: python -m cdf.eval.ck25_eval --validate-evidence docs/evidence/ck25-gpt-4o-mini-3x.json

  live-local:
    name: live-local (Postgres/Ontop + ArangoDB + ClickHouse)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    env:
      # Pinned, not inherited from the Makefile's `?=` defaults: `make up`
      # publishes these ports and the endpoint URLs below must match them, or
      # the stacks come up healthy and every leg refuses with zero citations —
      # a gate failure that points nowhere. Changing a port here means changing
      # it in the URLs too.
      CDF_ARANGO_PORT: 8530
      CDF_POSTGRES_PORT: 5433
      CDF_ONTOP_PORT: 18090
      CDF_CLICKHOUSE_HTTP_PORT: 8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine + live-leg libraries
        run: |
          pip install -e ".[test,service,mcp,auth]" python-arango clickhouse-connect \
            snowflake-connector-python ruff mypy -r deploy/pins/arango-sparql-py.txt
      - name: Bring up all local source stacks
        run: make up PY=python
      - name: Seed deterministic graph fixtures
        env:
          ARANGO_URL: http://127.0.0.1:${{ env.CDF_ARANGO_PORT }}
          ARANGO_DB: cmf
          ARANGO_USER: root
          ARANGO_PASSWORD: cdf
        run: |
          python deploy/arango/seed.py
          sleep 15
      - name: Three-engine live adapter tests
        env:
          ARANGO_URL: http://127.0.0.1:${{ env.CDF_ARANGO_PORT }}
          ARANGO_DB: cmf
          ARANGO_USER: root
          ARANGO_PASSWORD: cdf
          ONTOP_SPARQL_ENDPOINT: http://127.0.0.1:${{ env.CDF_ONTOP_PORT }}/sparql
          ONTOP_REFORMULATE_ENDPOINT: http://127.0.0.1:${{ env.CDF_ONTOP_PORT }}/ontop/reformulate
          CLICKHOUSE_DSN: clickhouse://cdf:cdf@127.0.0.1:${{ env.CDF_CLICKHOUSE_HTTP_PORT }}/analytics
        run: |
          pytest tests/test_arango_live.py tests/test_ontop_live.py \
            tests/test_clickhouse_live.py -q
      - name: Local-source golden gate
        env:
          ARANGO_URL: http://127.0.0.1:${{ env.CDF_ARANGO_PORT }}
          ARANGO_DB: cmf
          ARANGO_USER: root
          ARANGO_PASSWORD: cdf
          ONTOP_SPARQL_ENDPOINT: http://127.0.0.1:${{ env.CDF_ONTOP_PORT }}/sparql
          ONTOP_REFORMULATE_ENDPOINT: http://127.0.0.1:${{ env.CDF_ONTOP_PORT }}/ontop/reformulate
          CLICKHOUSE_DSN: clickhouse://cdf:cdf@127.0.0.1:${{ env.CDF_CLICKHOUSE_HTTP_PORT }}/analytics
          CDF_CSI_DIR: deploy/csi
          CDF_R2RML_DIR: deploy/r2rml
          CDF_PREPARED_QUESTIONS: deploy/questions.json
        run: python deploy/demo/gate.py --exclude-source snowflake:telemetry
      - name: Collect source logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/cdf-live-local-logs"
          docker compose -p cdf-arango -f deploy/arango/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-local-logs/arango.log"
          docker compose -p cdf-ontop -f deploy/ontop/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-local-logs/ontop.log"
          docker compose -p cdf-clickhouse -f deploy/clickhouse/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-local-logs/clickhouse.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-local-source-logs
          path: ${{ runner.temp }}/cdf-live-local-logs
          retention-days: 14
      - name: Tear down local source stacks
        if: always()
        run: make down

  live-full:
    name: live-full (scheduled four-engine SOTA baseline)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: live-local
    timeout-minutes: 35
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      # Same pin as live-local, and the same rule: these ports are what
      # `make up` publishes, and the URLs below must match them. A job-level
      # `env:` block cannot reference its own keys (the env context is only
      # available at step level), so the numbers are repeated here rather than
      # interpolated — keep the two halves in sync.
      CDF_ARANGO_PORT: 8530
      CDF_POSTGRES_PORT: 5433
      CDF_ONTOP_PORT: 18090
      CDF_CLICKHOUSE_HTTP_PORT: 8123
      ARANGO_URL: http://127.0.0.1:8530
      ARANGO_DB: cmf
      ARANGO_USER: root
      ARANGO_PASSWORD: cdf
      ONTOP_SPARQL_ENDPOINT: http://127.0.0.1:18090/sparql
      ONTOP_REFORMULATE_ENDPOINT: http://127.0.0.1:18090/ontop/reformulate
      CLICKHOUSE_DSN: clickhouse://cdf:cdf@127.0.0.1:8123/analytics
      CDF_CSI_DIR: deploy/csi
      CDF_R2RML_DIR: deploy/r2rml
      CDF_PREPARED_QUESTIONS: deploy/questions.json
      CDF_CORPUS_DIR: deploy/snowflake/fixtures
      CDF_STRICT_STARTUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine + all live-leg libraries
        run: |
          pip install -e ".[test,service,mcp,auth]" python-arango clickhouse-connect \
            snowflake-connector-python ruff mypy -r deploy/pins/arango-sparql-py.txt
      - name: Require and materialize Snowflake key-pair credentials
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          test -n "$SNOWFLAKE_ACCOUNT"
          test -n "$SNOWFLAKE_USER"
          test -n "$SNOWFLAKE_PRIVATE_KEY"
          umask 077
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake-key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/snowflake-key.p8" >> "$GITHUB_ENV"
      - name: Bring up and seed all source stacks
        run: |
          make up PY=python
          python deploy/arango/seed.py
          sleep 15
          python deploy/snowflake/load_corpus.py
      - name: Snowflake live adapter test
        run: pytest tests/test_snowflake_live.py -q
      - name: Emit complete live SOTA evidence
        run: |
          python -m cdf.eval.sota_scorecard --live \
            --output "$RUNNER_TEMP/cdf-sota-live.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdf-sota-live-evidence
          path: ${{ runner.temp }}/cdf-sota-live.json
          if-no-files-found: warn
          retention-days: 30
      - name: Collect source logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/cdf-live-full-logs"
          docker compose -p cdf-arango -f deploy/arango/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-full-logs/arango.log"
          docker compose -p cdf-ontop -f deploy/ontop/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-full-logs/ontop.log"
          docker compose -p cdf-clickhouse -f deploy/clickhouse/docker-compose.yml logs \
            --no-color > "$RUNNER_TEMP/cdf-live-full-logs/clickhouse.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-full-source-logs
          path: ${{ runner.temp }}/cdf-live-full-logs
          retention-days: 14
      - name: Tear down local source stacks
        if: always()
        run: make down
