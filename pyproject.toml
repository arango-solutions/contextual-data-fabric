[project]
name = "contextual-data-fabric"
version = "0.1.0"
description = "Contextual Data Fabric — federated query engine (M5) and supporting modules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ArangoDB Solutions" }]
dependencies = [
    # SPARQL parsing / algebra for the query-graph partition planner (M5 / E1).
    "rdflib>=7.0,<8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff>=0.4", "mypy>=1.10"]
# The HTTP seam (M9/PRD §10.2). httpx is fastapi's TestClient transport.
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# The semantic agent seam (M5/F2). MCP v2 renamed FastMCP to MCPServer.
mcp = ["mcp>=2.0,<3.0"]
# Generic OIDC JWT verification (signature/JWKS + RSA/EC key support).
auth = ["PyJWT[crypto]>=2.13,<3.0"]
# Explicit P2.2 assembled mode; imported lazily only when enabled/configured.
assembly = ["python-arango>=8.0,<9.0"]
# Manual external-corpus evidence generation (CK25 execution judge).
benchmark = ["PyYAML>=6.0", "pyoxigraph>=0.3.22"]

[project.scripts]
cdf-mcp = "cdf.mcp_server:main"
cdf-catalog = "cdf.catalog.cli:main"
cdf-sota = "cdf.eval.sota_scorecard:main"
cdf-optimizer-oracle = "cdf.eval.optimizer_oracle:main"
cdf-performance-baseline = "cdf.eval.performance_baseline:main"
cdf-ck25 = "cdf.eval.ck25_eval:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cdf.eval" = ["goldens/*.json", "corpora/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import the deploy/ namespace package
# (gate.py inventory tests). `python -m pytest` gets this for free via CWD;
# the bare `pytest` console script — what CI runs — does not.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS/JS page — long style/script lines are expected.
"deploy/demo/server.py" = ["E501"]
# Embedded R2RML fixture — long mapping lines are expected.
"tests/test_clickhouse.py" = ["E501"]

[tool.mypy]
# The live-source adapters lazy-import the owned engine libraries, which ship no
# type stubs; they are optional (not core deps) and only loaded on the live path.
[[tool.mypy.overrides]]
module = ["arango_sparql.*", "arango.*", "clickhouse_connect.*", "snowflake.*"]
ignore_missing_imports = true
